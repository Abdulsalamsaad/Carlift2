name: Build APK and AAB from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Locate Project
        run: |
          mkdir -p temp_zip
          unzip -q app.zip -d temp_zip
          PROJECT_ROOT=$(dirname $(find temp_zip -name "pubspec.yaml" | head -n 1))
          mkdir -p app_code
          cp -r "$PROJECT_ROOT"/* app_code/
          cp -r "$PROJECT_ROOT"/.* app_code/ 2>/dev/null || true

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Regenerate Modern Android Runner & Adjust Minimum SDK
        run: |
          flutter create fresh_runner --org com.carlift.app
          rm -rf app_code/android
          cp -r fresh_runner/android app_code/android
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' app_code/android/app/build.gradle

      - name: Force Override Dependency Conflict
        run: |
          echo "" >> pubspec.yaml
          echo "dependency_overrides:" >> pubspec.yaml
          echo "  intl: ^0.19.0" >> pubspec.yaml
        working-directory: ./app_code

      - name: Get Dependencies
        run: flutter pub get
        working-directory: ./app_code

      - name: Build APK (Release)
        run: flutter build apk --release
        working-directory: ./app_code

      - name: Build AAB (Release)
        run: flutter build appbundle --release
        working-directory: ./app_code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app_code/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app_code/build/app/outputs/bundle/release/app-release.aab
