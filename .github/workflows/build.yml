name: Build APK and AAB from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -q app.zip -d app_code

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        working-directory: ./app_code

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./app_code

      - name: Build AAB
        run: flutter build appbundle --release
        working-directory: ./app_code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app_code/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app_code/build/app/outputs/bundle/release/app-release.aab
